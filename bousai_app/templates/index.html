{% extends "base.html" %}

{% block title %}ホーム | 防災アプリ{% endblock %}

{% block content %}
<section class="home-section" aria-labelledby="map-title">
    <h1 id="map-title" class="section-heading">
        <span class="heading-label"><span class="heading-icon" aria-hidden="true">📍</span>避難所マップ</span>
    </h1>
    <div class="map-frame">
        <div id="shelterMap"></div>
    </div>
</section>

<section class="home-section" aria-labelledby="weather-title">
    <h2 id="weather-title" class="section-heading">
        <span class="heading-label"><span class="heading-icon" aria-hidden="true">☁</span>青森市 気象警報・注意報</span>
        <span class="weather-refresh"><span class="refresh-icon" aria-hidden="true">↻</span>10分おき自動更新</span>
    </h2>
    <div id="weatherContent" class="weather-panel" aria-live="polite">
        <p>読み込み中...</p>
    </div>
</section>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8222, 140.7474], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="weather-alert">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<p class="weather-status weather-alert"><span class="status-icon">!</span>警報・注意報が発表されています</p><ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="weather-status"><span class="status-icon">✓</span>現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-location"><span aria-hidden="true">📍</span>${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta"><span aria-hidden="true">◷</span>データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-meta"><span aria-hidden="true">◉</span>気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
