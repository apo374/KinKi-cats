<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('index') }}">防災アプリ</a>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="menuPanel">
        <span class="menu-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <nav id="menuPanel" class="menu-panel" aria-label="メインメニュー">
    <a href="{{ url_for('index') }}">ホーム</a>
    <a href="{{ url_for('shelter_search') }}">避難所検索</a>
    <a href="{{ url_for('shelter_register') }}">避難所登録</a>
    <a href="{{ url_for('board') }}">指示・発信ボード</a>
    {% if session.logged_in %}
      <a href="{{ url_for('logout') }}">ログアウト</a>
    {% else %}
      <a href="{{ url_for('login') }}">管理者ログイン</a>
    {% endif %}
  </nav>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <script>
    const menuButton = document.querySelector('.menu-button');
    const menuPanel = document.querySelector('#menuPanel');

    menuButton.addEventListener('click', () => {
      const isOpen = menuPanel.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
    });
  </script>
</body>
</html>
