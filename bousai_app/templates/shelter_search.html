{% extends "base.html" %}

{% block content %}
<section class="management-shell">
	<h1 class="form-heading">避難所検索</h1>
	<p class="management-choice-text">いずれかの情報を入力してください。</p>

	<form action="{{ url_for('search_results') }}" method="get" class="management-form shelter-search-form">
		<div class="form-grid">
			<div class="field-group">
				<label for="building-name">建物名</label>
				<input id="building-name" type="text" name="building_name" placeholder="例：青森市民会館" value="{{ request.args.get('building_name', request.args.get('name', '')) }}">
			</div>

			<div class="field-group">
				<label for="postal-code">郵便番号</label>
				<div class="postal-row">
					<input type="text" name="postal_code" id="postal-code" inputmode="numeric" placeholder="例：0300801" value="{{ request.args.get('postal_code', '') }}">
					<button type="button" class="secondary-button" id="postal-lookup">住所検索</button>
				</div>
			</div>

			<div class="field-group full-width">
				<label for="address-input">住所</label>
				<input type="text" name="address" id="address-input" placeholder="例：〇〇市〇〇町" value="{{ request.args.get('address', '') }}">
			</div>

			<div class="field-group">
				<label for="capacity">収容人数</label>
				<input id="capacity" type="number" min="0" name="capacity" placeholder="例：50" value="{{ request.args.get('capacity', '') }}">
			</div>

			<div class="form-section-heading">その他要望</div>

			<div class="field-group">
				<label for="pet-allowed">ペット受け入れ可否</label>
				<select id="pet-allowed" name="pet-allowed">
					<option value="">選択なし</option>
					<option value="yes" {% if request.args.get('pet_allowed') == 'yes' or request.args.get('pet-allowed') == 'yes' %}selected{% endif %}>可</option>
					<option value="no" {% if request.args.get('pet_allowed') == 'no' or request.args.get('pet-allowed') == 'no' %}selected{% endif %}>不可</option>
				</select>
			</div>

			<div class="field-group">
				<label for="barrier-free">バリアフリー対応</label>
				<select id="barrier-free" name="barrier_free">
					<option value="">選択なし</option>
					<option value="yes" {% if request.args.get('barrier_free') == 'yes' %}selected{% endif %}>対応あり</option>
					<option value="no" {% if request.args.get('barrier_free') == 'no' %}selected{% endif %}>未対応</option>
				</select>
			</div>
		</div>
		<input type="hidden" name="current_lat" id="current-lat">
		<input type="hidden" name="current_lng" id="current-lng">

		<div class="search-actions">
			<button type="submit" class="primary-button">検索する</button>
			<button type="button" class="secondary-button" id="location-button">現在地を取得</button>
			<span id="location-status" role="status" aria-live="polite"></span>
			<a class="link-button" href="{{ url_for('all_shelters') }}">全施設一覧</a>
		</div>
	</form>
</section>

<script>
	document.addEventListener('DOMContentLoaded', () => {
		const postalCodeInput = document.getElementById('postal-code');
		const addressInput = document.getElementById('address-input');
		const lookupButton = document.getElementById('postal-lookup');
		const locationButton = document.getElementById('location-button');
		const locationStatus = document.getElementById('location-status');
		const latitudeInput = document.getElementById('current-lat');
		const longitudeInput = document.getElementById('current-lng');
		const searchForm = document.querySelector('.shelter-search-form');
		const searchButton = searchForm ? searchForm.querySelector('button[type="submit"]') : null;
		const locationOptions = { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 };

		const getCurrentPosition = (onSuccess, onFailure) => {
			if (!navigator.geolocation) {
				onFailure('このブラウザでは現在地を取得できません。');
				return;
			}
			navigator.geolocation.getCurrentPosition(onSuccess, (error) => {
				const message = error.code === 1
					? '位置情報の利用が許可されていません。ブラウザの設定を確認してください。'
					: error.code === 3
						? '現在地の取得がタイムアウトしました。もう一度お試しください。'
						: '現在地を取得できませんでした。位置情報の設定を確認してください。';
				onFailure(message);
			}, locationOptions);
		};

		if (lookupButton && postalCodeInput && addressInput) {
			lookupButton.addEventListener('click', async () => {
				const postalCode = postalCodeInput.value.trim();
				if (!postalCode) {
					alert('郵便番号を入力してください。');
					postalCodeInput.focus();
					return;
				}

				lookupButton.disabled = true;
				lookupButton.textContent = '検索中...';
				try {
					const response = await fetch(`/api/address_search?postal_code=${encodeURIComponent(postalCode)}`);
					const data = await response.json();
					if (!response.ok || !data.address) {
						throw new Error(data.error || '住所検索に失敗しました。');
					}
					addressInput.value = data.address;
				} catch (error) {
					alert(error.message || '住所検索に失敗しました。');
				} finally {
					lookupButton.disabled = false;
					lookupButton.textContent = '住所を取得';
				}
			});
		}

		if (locationButton && locationStatus && latitudeInput && longitudeInput) {
			locationButton.addEventListener('click', () => {
				locationStatus.textContent = '現在地を取得中...';
				getCurrentPosition((position) => {
					latitudeInput.value = position.coords.latitude;
					longitudeInput.value = position.coords.longitude;
					locationStatus.textContent = '現在地を取得しました。検索ボタンで検索できます。';
				}, (message) => {
					latitudeInput.value = '';
					longitudeInput.value = '';
					locationStatus.textContent = message;
				});
			});
		}

		if (searchForm && searchButton && locationStatus && latitudeInput && longitudeInput) {
			searchForm.addEventListener('submit', (event) => {
				if (latitudeInput.value && longitudeInput.value) return;
				event.preventDefault();
				searchButton.disabled = true;
				locationStatus.textContent = '現在地を取得して検索中...';
				getCurrentPosition((position) => {
					latitudeInput.value = position.coords.latitude;
					longitudeInput.value = position.coords.longitude;
					searchForm.submit();
				}, (message) => {
					locationStatus.textContent = message + '通常検索を実行します。';
					searchForm.submit();
				});
			});
		}
	});
</script>
{% endblock %}
